android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
kotlin.code.style=official
# AGP 9 activa por defecto el "modo estricto" de R8: una regla -keep sin
# miembros ya no conserva el constructor. Las librerías (ML Kit/Firebase,
# GeckoView) escriben sus reglas para el comportamiento anterior; sin esto,
# ML Kit no puede crear sus registradores y la app se cierra al abrirse.
android.r8.strictFullModeForKeepRules=false
