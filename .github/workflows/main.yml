name: Nexo v7.1 - Android 16 Stability Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Android 16 stability hotfix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/nexo_hotfix.py
          python3 /tmp/nexo_hotfix.py
          git diff -- app/ build.gradle.kts || true

      - name: Save v7.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Nexo v7.1 Android 16 stability hotfix [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate source
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
              print("XML OK:", p)
          for p in Path("app/src/main/assets/extensions").rglob("manifest.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("EXTENSION OK:", p)
          PY
            node --check app/src/main/assets/extensions/nexo_bridge/content_script.js
          } 2>&1 | tee static-validation.log

      - name: Compile all and collect errors
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            --continue \
            --stacktrace \
            --no-daemon \
            2>&1 | tee full-build.log

      - name: Error summary
        if: always()
        shell: bash
        run: |
          {
            echo "===== BUILD ERRORS ====="
            grep -Ei \
              "(^e: | error:|FAILURE:|Execution failed|Unresolved reference|overrides nothing|Type mismatch|Cannot access|Missing class|AAPT: error|Caused by:|Lint found)" \
              full-build.log 2>/dev/null || true
            echo
            echo "===== WARNINGS ====="
            grep -Ei "(^w: |warning:)" full-build.log 2>/dev/null || true
          } > errors-summary.txt
          cat errors-summary.txt

      - name: Sign Release APKs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p app/build/outputs/apk/release-ci-signed "$HOME/.android"

          mapfile -t apks < <(
            find app/build/outputs/apk/release \
              -type f -name "*-unsigned.apk" 2>/dev/null | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No Release APKs yet."
            exit 0
          fi

          KEY="$HOME/.android/nexo-v71.keystore"
          keytool -genkeypair \
            -keystore "$KEY" \
            -storepass android \
            -alias nexo \
            -keypass android \
            -dname "CN=Nexo Browser 7.1,O=Nexo,C=CO" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          for apk in "${apks[@]}"; do
            base="$(basename "$apk" -unsigned.apk)"
            out="app/build/outputs/apk/release-ci-signed/${base}-signed.apk"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEY" \
              --ks-key-alias nexo \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$out" \
              "$apk"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
              --verbose "$out"
          done

      - name: Validate APKs
        if: always()
        shell: bash
        run: |
          set +e
          : > apk-validation.txt

          for apk in \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release-ci-signed/*.apk
          do
            [ -f "$apk" ] || continue
            echo "==== $apk ====" | tee -a apk-validation.txt
            unzip -tq "$apk" >/dev/null || echo "INVALID ZIP" | tee -a apk-validation.txt
            unzip -Z1 "$apk" | grep -qx assets/home/index.html \
              && echo "HOME OK" | tee -a apk-validation.txt
            unzip -Z1 "$apk" | grep -qx assets/extensions/nexo_bridge/manifest.json \
              && echo "BRIDGE OK" | tee -a apk-validation.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
              | head -n 12 | tee -a apk-validation.txt
            sha256sum "$apk" | tee -a apk-validation.txt
          done

      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7.1-android16-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7.1-android16-release
          path: app/build/outputs/apk/release-ci-signed/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7.1-diagnostics
          path: |
            static-validation.log
            full-build.log
            errors-summary.txt
            apk-validation.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "Static: ${{ steps.static.outcome }}"
          echo "Gradle: ${{ steps.gradle_build.outcome }}"
          [ "${{ steps.static.outcome }}" = "success" ]
          [ "${{ steps.gradle_build.outcome }}" = "success" ]

          debug_count="$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | wc -l)"
          release_count="$(find app/build/outputs/apk/release-ci-signed -name '*.apk' 2>/dev/null | wc -l)"

          echo "Debug=$debug_count Release=$release_count"
          [ "$debug_count" -ge 2 ]
          [ "$release_count" -ge 2 ]
