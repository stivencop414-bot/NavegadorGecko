name: Nexo v0.7.1 - Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.14.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -storepass android \
            -alias nexo \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nexo CI, OU=Browser, O=Nexo, L=CI, S=CI, C=US"

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)

          if [ "${#apks[@]}" -lt 2 ]; then
            echo "ERROR: se esperaban al menos 2 APK Release y se encontraron ${#apks[@]}."
            find app/build/outputs -maxdepth 5 -type f -name '*.apk' -print || true
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$APKSIGNER"

          for apk in "${apks[@]}"; do
            base="$(basename "$apk" .apk)"
            out="artifacts/release/${base}-signed.apk"

            "$APKSIGNER" sign \
              --ks ci-release.jks \
              --ks-key-alias nexo \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$out" \
              "$apk"

            "$APKSIGNER" verify --verbose "$out"
          done

          echo
          echo "===== APKs FIRMADAS ====="
          ls -lh artifacts/release
          echo
          echo "===== SHA-256 ====="
          sha256sum artifacts/release/*.apk

          count="$(find artifacts/release -maxdepth 1 -type f -name '*-signed.apk' | wc -l | tr -d ' ')"
          test "$count" -ge 2

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v071-Release-APKs
          path: artifacts/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v0.7.1 >/dev/null 2>&1; then
            echo "La Release v0.7.1 ya existe; se actualizarán sus APK."
          else
            gh release create v0.7.1 \
              --target "${GITHUB_SHA}" \
              --title "Nexo Browser v0.7.1" \
              --notes "Nexo Browser v0.7.1 con GeckoView 153. APK ARM64 recomendada para teléfonos Android modernos."
          fi

          gh release upload v0.7.1 artifacts/release/*.apk --clobber

          echo
          echo "===== RELEASE PUBLICADA ====="
          gh release view v0.7.1
