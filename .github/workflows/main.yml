                              }
                          }
                      )
              }

              private fun rememberAction(
                  extension: WebExtension,
                  session: GeckoSession?,
                  action: WebExtension.Action
              ) {
                  if (session == null) {
                      defaultActions[
                          extension.id
                      ] = action
                  } else {
