name: Nexo v7.1 - minSdk26 Full Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set GeckoView 153 minimum Android version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          old = s
          s = re.sub(
              r"minSdk\s*=\s*\d+",
              "minSdk = 26",
              s,
              count=1
          )

          if "minSdk = 26" not in s:
              raise SystemExit("No se pudo establecer minSdk 26")

          if s != old:
              p.write_text(s, encoding="utf-8")
              print("Nexo v7.1: minSdk actualizado a 26")
          else:
              print("minSdk 26 ya estaba aplicado")

          checks = [
              "compileSdk = 36",
              "minSdk = 26",
              'versionName = "0.7.1"',
              "geckoview-omni:153.0.20260715202819"
          ]

          text = p.read_text(encoding="utf-8")
          for item in checks:
              assert item in text, item
          PY

          git diff -- app/build.gradle.kts || true

      - name: Save minSdk fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts

          if ! git diff --cached --quiet; then
            git commit -m \
              "Set minSdk 26 for GeckoView 153 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate source
        id: static_validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
              print("XML OK:", p)

          for p in Path(
              "app/src/main/assets/extensions"
          ).rglob("manifest.json"):
              data = json.loads(
                  p.read_text(encoding="utf-8")
              )
              assert data["manifest_version"] == 2
              assert data["browser_specific_settings"]["gecko"]["id"]
              print("WEBEXTENSION OK:", p)

          gradle = Path(
              "app/build.gradle.kts"
          ).read_text(encoding="utf-8")

          assert "compileSdk = 36" in gradle
          assert "minSdk = 26" in gradle
          assert "targetSdk = 34" in gradle
          assert "153.0.20260715202819" in gradle

          print("BUILD CONFIG OK")
          PY

            node --check \
              app/src/main/assets/extensions/nexo_bridge/content_script.js
          } 2>&1 | tee static-validation.log

      - name: Compile Debug Release R8 and Lint
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          gradle \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            --continue \
            --stacktrace \
            --no-daemon \
            2>&1 | tee full-build.log

      - name: Collect all errors
        if: always()
        shell: bash
        run: |
          {
            echo "========================================"
            echo "NEXO V7.1 - TODOS LOS ERRORES DEL RUN"
            echo "========================================"
            echo

            echo "===== STATIC ====="
            cat static-validation.log 2>/dev/null || true

            echo
            echo "===== KOTLIN / JAVA / MANIFEST / R8 / LINT ====="
            grep -Ei \
              "(^e: | error:|FAILURE:|Execution failed|Unresolved reference|overrides nothing|Type mismatch|Cannot access|Missing class|AAPT: error|Manifest merger failed|Caused by:|Lint found|No value passed|Too many arguments)" \
              full-build.log 2>/dev/null || true

            echo
            echo "===== WARNINGS ====="
            grep -Ei \
              "(^w: |warning:|deprecated)" \
              full-build.log 2>/dev/null || true
          } > errors-summary.txt

          cat errors-summary.txt

      - name: Sign Release APKs
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            app/build/outputs/apk/release-ci-signed \
            "$HOME/.android"

          mapfile -t apks < <(
            find app/build/outputs/apk/release \
              -type f \
              -name "*-unsigned.apk" \
              2>/dev/null | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Sin APK Release para firmar."
            exit 0
          fi

          KEY="$HOME/.android/nexo-v71.keystore"

          if [ ! -f "$KEY" ]; then
            keytool -genkeypair \
              -keystore "$KEY" \
              -storepass android \
              -alias nexo \
              -keypass android \
              -dname "CN=Nexo Browser 7.1,O=Nexo,C=CO" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          for apk in "${apks[@]}"; do
            base="$(basename "$apk" -unsigned.apk)"
            out="app/build/outputs/apk/release-ci-signed/${base}-signed.apk"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEY" \
              --ks-key-alias nexo \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$out" \
              "$apk"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
              verify --verbose "$out"
          done

      - name: Deep APK validation
        if: always()
        shell: bash
        run: |
          set +e
          : > apk-validation.txt

          mapfile -t apks < <(
            find \
              app/build/outputs/apk/debug \
              app/build/outputs/apk/release-ci-signed \
              -type f \
              -name "*.apk" \
              2>/dev/null | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No se generaron APKs." \
              | tee -a apk-validation.txt
            exit 0
          fi

          for apk in "${apks[@]}"; do
            echo "====================================" \
              | tee -a apk-validation.txt
            echo "$apk" \
              | tee -a apk-validation.txt

            unzip -tq "$apk" >/dev/null ||
              echo "APK ZIP INVALIDO" \
                | tee -a apk-validation.txt

            for required in \
              assets/home/index.html \
              assets/extensions/nexo_bridge/manifest.json \
              assets/extensions/nexo_bridge/content_script.js
            do
              if unzip -Z1 "$apk" | grep -qx "$required"; then
                echo "OK: $required" \
                  | tee -a apk-validation.txt
              else
                echo "FALTA: $required" \
                  | tee -a apk-validation.txt
              fi
            done

            echo -n "ABIs: " \
              | tee -a apk-validation.txt

            unzip -Z1 "$apk" |
              awk -F/ '/^lib\// {print $2}' |
              sort -u |
              tr '\n' ' ' |
              tee -a apk-validation.txt

            echo | tee -a apk-validation.txt

            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$apk" |
              head -n 15 |
              tee -a apk-validation.txt

            sha256sum "$apk" \
              | tee -a apk-validation.txt
          done

      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7.1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7.1-release
          path: app/build/outputs/apk/release-ci-signed/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7.1-diagnostics
          path: |
            static-validation.log
            full-build.log
            errors-summary.txt
            apk-validation.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Final strict status
        if: always()
        shell: bash
        run: |
          echo "Static: ${{ steps.static_validation.outcome }}"
          echo "Gradle: ${{ steps.gradle_build.outcome }}"

          if [ "${{ steps.static_validation.outcome }}" != "success" ]; then
            exit 1
          fi

          if [ "${{ steps.gradle_build.outcome }}" != "success" ]; then
            exit 2
          fi

          debug_count="$(
            find app/build/outputs/apk/debug \
              -name '*.apk' 2>/dev/null | wc -l
          )"

          release_count="$(
            find app/build/outputs/apk/release-ci-signed \
              -name '*.apk' 2>/dev/null | wc -l
          )"

          echo "Debug APKs: $debug_count"
          echo "Release APKs: $release_count"

          [ "$debug_count" -ge 2 ]
          [ "$release_count" -ge 2 ]

          echo "NEXO V7.1 BUILD OK"
