name: Nexo v7 - Apply UX Fixes & Full Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply complete Nexo v7 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/nexo_v7.py
          python3 /tmp/nexo_v7.py
          git diff -- app/ || true

      - name: Save Nexo v7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/

          if ! git diff --cached --quiet; then
            git commit -m "Implement Nexo Browser v7 UX fixes [skip ci]"
            git push origin HEAD:main
          else
            echo "Nexo v7 patch already applied."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate XML JSON JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
              print("XML OK:", p)

          for p in Path("app/src/main/assets/extensions").rglob("manifest.json"):
              data = json.loads(p.read_text(encoding="utf-8"))
              assert data["manifest_version"] == 2
              assert data["browser_specific_settings"]["gecko"]["id"]
              print("EXTENSION OK:", p)
          PY

          node --check app/src/main/assets/extensions/nexo_bridge/content_script.js
          grep -q POST_NOTIFICATIONS app/src/main/AndroidManifest.xml
          grep -q 'versionName = "0.7.0"' app/build.gradle.kts

      - name: Build Debug Release R8 and Lint
        shell: bash
        run: |
          set -o pipefail
          gradle             :app:assembleDebug             :app:assembleRelease             :app:lintDebug             :app:lintRelease             --stacktrace             --no-daemon             2>&1 | tee full-build.log

      - name: Sign Release APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/build/outputs/apk/release-ci-signed "$HOME/.android"

          KEYSTORE="$HOME/.android/nexo-v7.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storepass android               -alias nexo               -keypass android               -dname "CN=Nexo Browser V7,O=Nexo,C=CO"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            base="$(basename "$apk" -unsigned.apk)"
            output="app/build/outputs/apk/release-ci-signed/${base}-signed.apk"

            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign               --ks "$KEYSTORE"               --ks-key-alias nexo               --ks-pass pass:android               --key-pass pass:android               --out "$output"               "$apk"

            "$ANDROID_HOME/build-tools/34.0.0/apksigner"               verify --verbose "$output"
          done

      - name: Verify four APKs
        shell: bash
        run: |
          set -euo pipefail

          debug_count="$(find app/build/outputs/apk/debug -name '*.apk' | wc -l)"
          release_count="$(find app/build/outputs/apk/release-ci-signed -name '*.apk' | wc -l)"

          [ "$debug_count" -eq 2 ]
          [ "$release_count" -eq 2 ]

          : > apk-validation.txt

          for apk in             app/build/outputs/apk/debug/*.apk             app/build/outputs/apk/release-ci-signed/*.apk
          do
            echo "====================================" | tee -a apk-validation.txt
            echo "$apk" | tee -a apk-validation.txt

            unzip -tq "$apk" >/dev/null
            unzip -Z1 "$apk" | grep -qx assets/home/index.html
            unzip -Z1 "$apk" | grep -qx assets/extensions/nexo_bridge/manifest.json
            unzip -Z1 "$apk" | grep -qx assets/extensions/nexo_bridge/content_script.js

            "$ANDROID_HOME/build-tools/34.0.0/aapt"               dump badging "$apk" | head -n 15 | tee -a apk-validation.txt

            sha256sum "$apk" | tee -a apk-validation.txt
          done

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7-UX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7-UX-release
          path: app/build/outputs/apk/release-ci-signed/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7-UX-reports
          path: |
            full-build.log
            apk-validation.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
