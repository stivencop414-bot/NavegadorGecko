name: Nexo v0.7.1 - Gecko153 Release Final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.14.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager             "platforms;android-${COMPILE_SDK}"             "build-tools;${BUILD_TOOLS}"             "platform-tools"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"             -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Patch GeckoView 153 PromptDelegate
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/nexo_patch.py
          python3 /tmp/nexo_patch.py
          grep -n "onInstallPromptRequest\|onUpdatePrompt"             app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Persist verified GeckoView fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt; then
            echo "El fix ya estaba guardado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt
            git commit -m "Fix GeckoView 153 PromptDelegate [skip ci]"
            git push origin HEAD:main
          fi

      - name: Sign APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          keytool -genkeypair             -keystore nexo-ci.jks             -storepass android             -alias nexo             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Nexo Browser CI,O=Nexo,C=CO"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          ARM64="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*armeabi-v7a*.apk' | head -n 1)"

          test -n "$ARM64"
          test -n "$ARM32"

          "$APKSIGNER" sign             --ks nexo-ci.jks             --ks-key-alias nexo             --ks-pass pass:android             --key-pass pass:android             --out artifacts/release/Nexo-v0.7.1-arm64-v8a.apk             "$ARM64"

          "$APKSIGNER" sign             --ks nexo-ci.jks             --ks-key-alias nexo             --ks-pass pass:android             --key-pass pass:android             --out artifacts/release/Nexo-v0.7.1-armeabi-v7a.apk             "$ARM32"

          "$APKSIGNER" verify --verbose artifacts/release/Nexo-v0.7.1-arm64-v8a.apk
          "$APKSIGNER" verify --verbose artifacts/release/Nexo-v0.7.1-armeabi-v7a.apk

          ls -lh artifacts/release/*.apk
          sha256sum artifacts/release/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v071-Release-APKs
          path: artifacts/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view v0.7.1 >/dev/null 2>&1; then
            gh release create v0.7.1               --target "$GITHUB_SHA"               --title "Nexo Browser v0.7.1"               --notes "Nexo Browser v0.7.1 con GeckoView 153."
          fi

          gh release upload v0.7.1             artifacts/release/Nexo-v0.7.1-arm64-v8a.apk             artifacts/release/Nexo-v0.7.1-armeabi-v7a.apk             --clobber

          gh release view v0.7.1
