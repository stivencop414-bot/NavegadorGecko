name: Nexo v0.13.4 - Foreground Audio Stability Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: nexo-v0134-foreground-audio-stability
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.14.4"

    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Nexo v0.13.4 foreground audio fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")
          MAIN = ROOT / "app/src/main/java/com/ejemplo/navegador/MainActivity.kt"
          MEDIA = ROOT / "app/src/main/java/com/ejemplo/navegador/BrowserMediaController.kt"
          SERVICE = ROOT / "app/src/main/java/com/ejemplo/navegador/MediaPlaybackService.kt"
          GRADLE = ROOT / "app/build.gradle.kts"

          main = MAIN.read_text(encoding="utf-8")
          gradle = GRADLE.read_text(encoding="utf-8")

          def must_replace(text, old, new, label, count=1):
              if old in text:
                  return text.replace(old, new, count)

              tokens = re.split(r"\s+", old.strip())
              pattern = r"\s+".join(
                  re.escape(token)
                  for token in tokens
                  if token
              )

              updated, replaced = re.subn(
                  pattern,
                  lambda _: new.strip("\n") + "\n",
                  text,
                  count=count,
                  flags=re.MULTILINE,
              )

              if replaced != count:
                  raise RuntimeError(
                      f"No se encontró bloque para: {label} "
                      f"(esperado={count}, encontrado={replaced})"
                  )

              return updated

          MEDIA.write_text(r'''package com.ejemplo.navegador
          
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import org.mozilla.geckoview.MediaSession
          
          object BrowserMediaController {
              interface Listener {
                  fun onBrowserMediaStateChanged()
              }
          
              data class Snapshot(
                  val tabId: String,
                  val title: String,
                  val playing: Boolean
              )
          
              private data class Entry(
                  val mediaSession: MediaSession,
                  var title: String,
                  var playing: Boolean = false
              )
          
              private data class VideoState(
                  var present: Boolean = false,
                  var playing: Boolean = false,
                  var width: Int = 0,
                  var height: Int = 0
              )
          
              private val entries = linkedMapOf<String, Entry>()
              private val videos = mutableMapOf<String, VideoState>()
              private val recentPlayback = mutableMapOf<String, Long>()
          
              /*
               * Ventana de protección para Home/PiP.
               * Durante esta ventana una pausa transitoria emitida por el sitio
               * no debe apagar GeckoSession ni el foreground service.
               */
              private val playbackHoldUntil = mutableMapOf<String, Long>()
          
              private val main = Handler(Looper.getMainLooper())
          
              private var listener: Listener? = null
              private var currentTabId: String? = null
          
              private fun now(): Long = SystemClock.elapsedRealtime()
          
              private fun markRecentlyPlaying(tabId: String) {
                  recentPlayback[tabId] = now()
              }
          
              private fun hasActiveHold(tabId: String): Boolean {
                  val until = playbackHoldUntil[tabId] ?: return false
                  if (now() >= until) {
                      playbackHoldUntil.remove(tabId)
                      return false
                  }
                  return true
              }
          
              private fun cleanupExpiredHold(tabId: String) {
                  if (hasActiveHold(tabId)) return
          
                  playbackHoldUntil.remove(tabId)
          
                  val entry = entries[tabId]
                  if (
                      entry != null &&
                      !entry.playing &&
                      videos[tabId]?.playing != true &&
                      !entry.mediaSession.isActive
                  ) {
                      entries.remove(tabId)
                      if (currentTabId == tabId) {
                          currentTabId = null
                      }
                  }
          
                  notifyChanged()
              }
          
              fun holdPlayback(
                  tabId: String,
                  durationMs: Long = 10_000L
              ) {
                  val duration = durationMs.coerceAtLeast(1_000L)
                  val until = now() + duration
                  val previous = playbackHoldUntil[tabId] ?: 0L
                  playbackHoldUntil[tabId] = maxOf(previous, until)
          
                  main.postDelayed(
                      { cleanupExpiredHold(tabId) },
                      duration + 100L
                  )
          
                  notifyChanged()
              }
          
              fun clearPlaybackHold(tabId: String) {
                  if (playbackHoldUntil.remove(tabId) != null) {
                      notifyChanged()
                  }
              }
          
              fun isPlaybackHoldActive(tabId: String): Boolean =
                  hasActiveHold(tabId)
          
              fun attach(value: Listener?) {
                  listener = value
                  listener?.onBrowserMediaStateChanged()
              }
          
              fun onActivated(
                  tab: BrowserTab,
                  media: MediaSession
              ) {
                  val previous = entries[tab.id]
          
                  entries[tab.id] = Entry(
                      mediaSession = media,
                      title = tab.title.ifBlank {
                          previous?.title ?: "Multimedia en Nexo"
                      },
                      playing = previous?.playing == true
                  )
          
                  currentTabId = tab.id
                  notifyChanged()
              }
          
              fun onDeactivated(
                  tabId: String,
                  media: MediaSession
              ) {
                  val entry = entries[tabId]
          
                  if (entry?.mediaSession === media) {
                      if (hasActiveHold(tabId)) {
                          entry.playing = false
                      } else {
                          entries.remove(tabId)
                          if (currentTabId == tabId) {
                              currentTabId = null
                          }
                      }
                  }
          
                  notifyChanged()
              }
          
              fun onPlay(
                  tab: BrowserTab,
                  media: MediaSession
              ) {
                  val entry = entries[tab.id]
          
                  if (entry == null || entry.mediaSession !== media) {
                      entries[tab.id] = Entry(
                          mediaSession = media,
                          title = tab.title.ifBlank {
                              "Multimedia en Nexo"
                          },
                          playing = true
                      )
                  } else {
                      if (tab.title.isNotBlank()) {
                          entry.title = tab.title
                      }
                      entry.playing = true
                  }
          
                  currentTabId = tab.id
                  markRecentlyPlaying(tab.id)
                  notifyChanged()
              }
          
              fun onPause(
                  tabId: String,
                  media: MediaSession
              ) {
                  entries[tabId]
                      ?.takeIf { it.mediaSession === media }
                      ?.playing = false
          
                  notifyChanged()
              }
          
              fun onStop(
                  tabId: String,
                  media: MediaSession
              ) {
                  val entry = entries[tabId]
          
                  if (entry?.mediaSession === media) {
                      if (hasActiveHold(tabId)) {
                          entry.playing = false
                      } else {
                          entries.remove(tabId)
                          recentPlayback.remove(tabId)
                          if (currentTabId == tabId) {
                              currentTabId = null
                          }
                      }
                  }
          
                  notifyChanged()
              }
          
              fun updateMetadata(
                  tabId: String,
                  media: MediaSession,
                  title: String?
              ) {
                  val entry = entries[tabId] ?: return
                  if (entry.mediaSession !== media) return
          
                  if (!title.isNullOrBlank()) {
                      entry.title = title
                  }
          
                  notifyChanged()
              }
          
              fun updateTabTitle(
                  tabId: String,
                  title: String
              ) {
                  val entry = entries[tabId] ?: return
          
                  if (title.isNotBlank()) {
                      entry.title = title
                  }
          
                  if (entry.playing || hasActiveHold(tabId)) {
                      notifyChanged()
                  }
              }
          
              fun onVideoState(
                  tabId: String,
                  present: Boolean,
                  playing: Boolean,
                  width: Int,
                  height: Int
              ) {
                  videos[tabId] = VideoState(
                      present = present,
                      playing = playing,
                      width = width.coerceAtLeast(0),
                      height = height.coerceAtLeast(0)
                  )
          
                  if (playing) {
                      markRecentlyPlaying(tabId)
                  }
          
                  listener?.onBrowserMediaStateChanged()
              }
          
              fun resetVideo(tabId: String) {
                  videos.remove(tabId)
                  listener?.onBrowserMediaStateChanged()
              }
          
              fun removeTab(tabId: String) {
                  entries.remove(tabId)
                  videos.remove(tabId)
                  recentPlayback.remove(tabId)
                  playbackHoldUntil.remove(tabId)
          
                  if (currentTabId == tabId) {
                      currentTabId = null
                  }
          
                  notifyChanged()
              }
          
              fun isPlaying(tabId: String): Boolean =
                  entries[tabId]?.playing == true
          
              fun isAnyPlaying(): Boolean =
                  entries.values.any { it.playing }
          
              fun isVideoPresent(tabId: String): Boolean =
                  videos[tabId]?.present == true
          
              fun isVideoPlaying(tabId: String): Boolean =
                  videos[tabId]?.playing == true
          
              fun isPlaybackActive(tabId: String): Boolean =
                  isPlaying(tabId) || isVideoPlaying(tabId)
          
              fun wasRecentlyPlaying(
                  tabId: String,
                  windowMs: Long = 6_000L
              ): Boolean {
                  val last = recentPlayback[tabId] ?: return false
                  return now() - last <= windowMs.coerceAtLeast(0L)
              }
          
              fun shouldKeepAlive(
                  tabId: String,
                  windowMs: Long = 6_000L
              ): Boolean =
                  isPlaybackActive(tabId) ||
                      hasActiveHold(tabId) ||
                      wasRecentlyPlaying(tabId, windowMs)
          
              fun videoAspect(tabId: String): Pair<Int, Int> {
                  val state = videos[tabId]
                  return if (
                      (state?.width ?: 0) > 0 &&
                      (state?.height ?: 0) > 0
                  ) {
                      state!!.width to state.height
                  } else {
                      16 to 9
                  }
              }
          
              /*
               * Solo reanuda automáticamente cuando existe una transición
               * explícitamente protegida por MainActivity.
               * Esto evita reactivar un contenido que el usuario pausó a mano.
               */
              fun resumeIfRecent(
                  tabId: String,
                  @Suppress("UNUSED_PARAMETER") windowMs: Long = 6_000L
              ): Boolean {
                  if (!hasActiveHold(tabId)) {
                      return false
                  }
          
                  val media = entries[tabId]?.mediaSession ?: return false
          
                  main.post {
                      runCatching {
                          if (media.isActive) {
                              media.play()
                          }
                      }
                  }
          
                  return true
              }
          
              private fun snapshotFor(
                  allowHold: Boolean
              ): Snapshot? {
                  fun usable(id: String): Boolean =
                      isPlaybackActive(id) ||
                          (allowHold && hasActiveHold(id))
          
                  val preferredId =
                      currentTabId?.takeIf { id ->
                          entries[id] != null && usable(id)
                      }
          
                  val selectedId =
                      preferredId
                          ?: entries.keys.lastOrNull { usable(it) }
                          ?: return null
          
                  val entry = entries[selectedId] ?: return null
                  currentTabId = selectedId
          
                  return Snapshot(
                      tabId = selectedId,
                      title = entry.title.ifBlank {
                          "Multimedia en Nexo"
                      },
                      playing = isPlaybackActive(selectedId)
                  )
              }
          
              fun snapshot(): Snapshot? =
                  snapshotFor(allowHold = false)
          
              fun snapshotForService(): Snapshot? =
                  snapshotFor(allowHold = true)
          
              fun pauseCurrent() {
                  val id = currentTabId ?: entries.keys.lastOrNull() ?: return
                  val entry = entries[id] ?: return
          
                  playbackHoldUntil.remove(id)
                  recentPlayback.remove(id)
                  entry.playing = false
                  notifyChanged()
          
                  main.post {
                      runCatching {
                          entry.mediaSession.pause()
                      }
                  }
              }
          
              fun stopCurrent() {
                  val id = currentTabId ?: entries.keys.lastOrNull() ?: return
                  val entry = entries[id] ?: return
          
                  playbackHoldUntil.remove(id)
                  recentPlayback.remove(id)
                  entry.playing = false
                  notifyChanged()
          
                  main.post {
                      runCatching {
                          entry.mediaSession.stop()
                      }
                  }
              }
          
              private fun notifyChanged() {
                  listener?.onBrowserMediaStateChanged()
          
                  val context = runCatching {
                      AppContext.get()
                  }.getOrNull() ?: return
          
                  MediaPlaybackService.sync(context)
              }
          }
          ''', encoding="utf-8")
          SERVICE.write_text(r'''package com.ejemplo.navegador
          
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          
          class MediaPlaybackService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  instance = this
                  startRequested = false
          
                  /*
                   * IMPORTANTE:
                   * Android exige que cualquier Service iniciado mediante
                   * startForegroundService() se promocione a foreground casi
                   * inmediatamente. No esperamos a consultar de nuevo el estado
                   * de YouTube porque puede cambiar durante Home/PiP.
                   */
                  promoteToForeground(
                      buildBootstrapNotification()
                  )
              }
          
              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  when (intent?.action) {
                      ACTION_PAUSE ->
                          BrowserMediaController.pauseCurrent()
          
                      ACTION_STOP ->
                          BrowserMediaController.stopCurrent()
                  }
          
                  refreshFromController()
                  return START_NOT_STICKY
              }
          
              override fun onDestroy() {
                  if (instance === this) {
                      instance = null
                  }
                  startRequested = false
                  super.onDestroy()
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              private fun refreshFromController() {
                  val state =
                      BrowserMediaController.snapshotForService()
          
                  if (
                      state == null ||
                      !BrowserPrefs.backgroundMedia(this)
                  ) {
                      stopForeground(Service.STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return
                  }
          
                  promoteToForeground(
                      buildNotification(state)
                  )
              }
          
              private fun promoteToForeground(
                  notification: Notification
              ) {
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
                      )
                  } else {
                      startForeground(
                          NOTIFICATION_ID,
                          notification
                      )
                  }
              }
          
              private fun buildBootstrapNotification(): Notification =
                  Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_nexo_logo)
                      .setContentTitle("Nexo Browser")
                      .setContentText("Preparando reproducción multimedia…")
                      .setCategory(Notification.CATEGORY_TRANSPORT)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
          
              private fun buildNotification(
                  state: BrowserMediaController.Snapshot
              ): Notification {
                  val open = PendingIntent.getActivity(
                      this,
                      200,
                      Intent(this, MainActivity::class.java).apply {
                          addFlags(
                              Intent.FLAG_ACTIVITY_CLEAR_TOP or
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP
                          )
                      },
                      PendingIntent.FLAG_UPDATE_CURRENT or
                          PendingIntent.FLAG_IMMUTABLE
                  )
          
                  val pause = PendingIntent.getService(
                      this,
                      201,
                      Intent(
                          this,
                          MediaPlaybackService::class.java
                      ).setAction(ACTION_PAUSE),
                      PendingIntent.FLAG_UPDATE_CURRENT or
                          PendingIntent.FLAG_IMMUTABLE
                  )
          
                  val stop = PendingIntent.getService(
                      this,
                      202,
                      Intent(
                          this,
                          MediaPlaybackService::class.java
                      ).setAction(ACTION_STOP),
                      PendingIntent.FLAG_UPDATE_CURRENT or
                          PendingIntent.FLAG_IMMUTABLE
                  )
          
                  val statusText =
                      if (state.playing) {
                          "Reproduciendo desde Nexo Browser"
                      } else {
                          "Manteniendo reproducción en segundo plano"
                      }
          
                  return Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_nexo_logo)
                      .setContentTitle(state.title)
                      .setContentText(statusText)
                      .setContentIntent(open)
                      .setCategory(Notification.CATEGORY_TRANSPORT)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .addAction(
                          Notification.Action.Builder(
                              android.R.drawable.ic_media_pause,
                              "Pausar",
                              pause
                          ).build()
                      )
                      .addAction(
                          Notification.Action.Builder(
                              android.R.drawable.ic_menu_close_clear_cancel,
                              "Detener",
                              stop
                          ).build()
                      )
                      .setStyle(
                          Notification.MediaStyle()
                              .setShowActionsInCompactView(0, 1)
                      )
                      .build()
              }
          
              private fun createChannel() {
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              "Reproducción multimedia",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description =
                                  "Controles de audio y video de Nexo Browser"
                              setShowBadge(false)
                          }
                      )
              }
          
              companion object {
                  private const val CHANNEL_ID = "nexo_media_playback"
                  private const val NOTIFICATION_ID = 1907
                  private const val ACTION_REFRESH = "nexo.media.REFRESH"
                  private const val ACTION_PAUSE = "nexo.media.PAUSE"
                  private const val ACTION_STOP = "nexo.media.STOP"
          
                  private val main = Handler(Looper.getMainLooper())
          
                  @Volatile
                  private var instance: MediaPlaybackService? = null
          
                  @Volatile
                  private var startRequested = false
          
                  fun sync(context: Context) {
                      val app = context.applicationContext
                      val state =
                          BrowserMediaController.snapshotForService()
          
                      val enabled =
                          BrowserPrefs.backgroundMedia(app)
          
                      val current = instance
          
                      if (state == null || !enabled) {
                          if (current != null) {
                              main.post {
                                  if (instance === current) {
                                      current.refreshFromController()
                                  }
                              }
                          } else if (!startRequested) {
                              runCatching {
                                  app.stopService(
                                      Intent(
                                          app,
                                          MediaPlaybackService::class.java
                                      )
                                  )
                              }
                          }
                          return
                      }
          
                      if (current != null) {
                          main.post {
                              if (instance === current) {
                                  current.refreshFromController()
                              }
                          }
                          return
                      }
          
                      if (startRequested) {
                          return
                      }
          
                      val intent = Intent(
                          app,
                          MediaPlaybackService::class.java
                      ).setAction(ACTION_REFRESH)
          
                      startRequested = true
          
                      runCatching {
                          if (Build.VERSION.SDK_INT >= 26) {
                              app.startForegroundService(intent)
                          } else {
                              app.startService(intent)
                          }
                      }.onFailure { error ->
                          startRequested = false
                          android.util.Log.w(
                              "NexoMedia",
                              "No se pudo iniciar servicio multimedia",
                              error
                          )
                      }
          
                      /*
                       * Si el sistema rechazara silenciosamente la creación,
                       * permitir un nuevo intento más adelante.
                       */
                      main.postDelayed(
                          {
                              if (instance == null) {
                                  startRequested = false
                              }
                          },
                          6_000L
                      )
                  }
          
                  fun stop(context: Context) {
                      val app = context.applicationContext
                      val current = instance
          
                      if (current != null) {
                          main.post {
                              if (instance === current) {
                                  current.stopForeground(
                                      Service.STOP_FOREGROUND_REMOVE
                                  )
                                  current.stopSelf()
                              }
                          }
                      } else if (!startRequested) {
                          runCatching {
                              app.stopService(
                                  Intent(
                                      app,
                                      MediaPlaybackService::class.java
                                  )
                              )
                          }
                      }
                  }
              }
          }
          ''', encoding="utf-8")

          main = must_replace(
              main,
              '''    override fun onResume() {
                  suppressAutoPipOnce = false
                  backgroundPlaybackWasActive = false
                  super.onResume()
              ''',
              '''    override fun onResume() {
