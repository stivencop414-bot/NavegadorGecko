          js = replace_between(
              js,
              "  function setPipIsolation(active) {",
              "  function reportVideoState() {",
              r'''  function setPipIsolation(active) {
                  const nextActive =
                    active === true;

                  const activating =
                    nextActive &&
                    !pipActive;

                  pipActive =
                    nextActive;

                  if (!pipActive) {
                    pipKeepPlaying = false;
                    pipRecoveryUntil = 0;
                    clearPipIsolation();
                    return;
                  }

                  const video =
                    bestVideo(true) ||
                    bestVideo(false);

                  if (!video) {
                    return;
                  }

                  /*
                   * Recordar intención de reproducción únicamente
                   * en el primer momento de entrada a PiP.
                   */
                  if (activating) {
                    pipKeepPlaying =
                      !video.paused &&
                      !video.ended;

                    pipRecoveryUntil =
                      pipKeepPlaying
                        ? Date.now() + 5_000
                        : 0;
                  }

                  clearPipIsolation();
                  ensurePipStyle();

                  pipVideo = video;

                  let current =
                    video.parentElement;

                  while (
                    current &&
                    current !== document.body &&
                    current !==
                      document.documentElement
                  ) {
                    current.classList.add(
                      "nexo-pip-ancestor"
                    );

                    pipAncestors.push(
                      current
                    );

                    current =
                      current.parentElement;
                  }

                  document.documentElement
                    .classList.add(
                      "nexo-pip-root"
                    );

                  video.classList.add(
                    "nexo-pip-video"
                  );

                  recoverPipPlayback();
                }

                function recoverPipPlayback() {
                  if (
                    !pipActive ||
                    !pipKeepPlaying ||
                    Date.now() >
                      pipRecoveryUntil
                  ) {
                    return;
                  }

                  const video =
                    pipVideo ||
                    bestVideo(false);

                  if (
                    !video ||
                    video.ended ||
                    !video.paused
                  ) {
                    return;
                  }

                  try {
                    Promise.resolve(
                      video.play()
                    ).catch(() => {});
                  } catch (_) {}
                }

                /*
                 * YouTube funciona como SPA y puede reemplazar
                 * o mover el <video> sin recargar la página.
                 */
                function refreshPipIsolation() {
                  if (!pipActive) {
                    return;
                  }

                  const video =
                    bestVideo(true) ||
                    bestVideo(false);

                  if (!video) {
                    recoverPipPlayback();
                    return;
                  }

                  const currentStillValid =
                    pipVideo === video &&
                    video.isConnected &&
                    pipAncestors.every(
                      ancestor =>
                        ancestor.isConnected &&
                        ancestor.classList.contains(
                          "nexo-pip-ancestor"
                        )
                    );

                  if (!currentStillValid) {
                    setPipIsolation(true);
                  }

                  recoverPipPlayback();
                }

          ''',
              "aislamiento y recuperación PiP JS"
          )

