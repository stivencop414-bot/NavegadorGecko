          MAIN.write_text(main, encoding="utf-8")

          if 'versionCode = 20' in gradle:
              gradle = gradle.replace(
                  'versionCode = 20',
                  'versionCode = 21',
                  1
              )
          elif 'versionCode = 21' not in gradle:
              raise RuntimeError("VersionCode base inesperado")

          if 'versionName = "0.13.3"' in gradle:
              gradle = gradle.replace(
                  'versionName = "0.13.3"',
                  'versionName = "0.13.4"',
                  1
              )
          elif 'versionName = "0.13.4"' not in gradle:
              raise RuntimeError("VersionName base inesperado")

          GRADLE.write_text(gradle, encoding="utf-8")

          print("✅ Nexo v0.13.4 foreground/audio patch aplicado")
          PY

          echo ""
          echo "========================================"
