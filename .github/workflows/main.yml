      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o gradle.zip

          unzip -q gradle.zip

          echo \
            "$PWD/gradle-${GRADLE_VERSION}/bin" \
            >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug Release and Lint
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee full-build.log

      - name: Validate generated APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " APK GENERADOS"
          echo "========================================"

          find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          ARM64="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*arm64-v8a*.apk' \
              | head -n 1
          )"

          ARM32="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*armeabi-v7a*.apk' \
              | head -n 1
          )"

          test -n "$ARM64" || {
            echo "❌ No se generó APK arm64-v8a"
            exit 1
          }

          test -n "$ARM32" || {
            echo "❌ No se generó APK armeabi-v7a"
            exit 1
          }

          echo "✅ APK arm64-v8a detectado"
          echo "✅ APK armeabi-v7a detectado"

      - name: Save verified Nexo v0.13.3 source
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/build.gradle.kts \
            app/src/main/java/com/ejemplo/navegador/MainActivity.kt \
            app/src/main/java/com/ejemplo/navegador/BrowserMediaController.kt \
            app/src/main/java/com/ejemplo/navegador/TabManager.kt \
            app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt \
            app/src/main/java/com/ejemplo/navegador/ExtensionsActivity.kt \
            app/src/main/assets/extensions/nexo_bridge/content_script.js

          if git diff --cached --quiet; then
            echo "ℹ️ No hay cambios nuevos para guardar."
          else
            git commit \
              -m "Nexo v0.13.3 PiP audio extensions fix [skip ci]"

            git push \
              origin \
              HEAD:main

            echo "✅ Código v0.13.3 guardado en main"
          fi

      - name: Sign Release APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/release

          keytool \
            -genkeypair \
            -keystore nexo-v0133-ci.jks \
            -storepass android \
            -alias nexo \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nexo Browser v0.13.3,O=Nexo,C=CO"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          ARM64="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*arm64-v8a*.apk' \
              | head -n 1
          )"

          ARM32="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*armeabi-v7a*.apk' \
              | head -n 1
          )"

          "$APKSIGNER" sign \
            --ks nexo-v0133-ci.jks \
            --ks-key-alias nexo \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out \
            artifacts/release/Nexo-v0.13.3-arm64-v8a.apk \
            "$ARM64"

          "$APKSIGNER" sign \
            --ks nexo-v0133-ci.jks \
            --ks-key-alias nexo \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out \
            artifacts/release/Nexo-v0.13.3-armeabi-v7a.apk \
            "$ARM32"

          "$APKSIGNER" verify \
            --verbose \
            artifacts/release/Nexo-v0.13.3-arm64-v8a.apk

          "$APKSIGNER" verify \
            --verbose \
            artifacts/release/Nexo-v0.13.3-armeabi-v7a.apk

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts/release

          sha256sum \
            Nexo-v0.13.3-arm64-v8a.apk \
            Nexo-v0.13.3-armeabi-v7a.apk \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload Nexo v0.13.3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v0133-PiP-Audio-Extensions-Release
          path: |
            artifacts/release/Nexo-v0.13.3-arm64-v8a.apk
            artifacts/release/Nexo-v0.13.3-armeabi-v7a.apk
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v0133-build-diagnostics
          path: |
            full-build.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
