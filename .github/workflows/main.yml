name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Write corrected MainActivity
        shell: bash
        run: |
          echo '' | base64 -d > app/src/main/java/com/ejemplo/navegador/MainActivity.kt
          echo "MainActivity.kt actualizado:"
          sed -n '1,240p' app/src/main/java/com/ejemplo/navegador/MainActivity.kt

      - name: Save source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ejemplo/navegador/MainActivity.kt
          if git diff --cached --quiet; then
            echo "MainActivity.kt ya estaba actualizado."
          else
            git commit -m "Fix GeckoView 125 nullable extension [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build Debug
        id: debug
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log

      - name: Build Release
        id: release
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Show APKs
        if: always()
        shell: bash
        run: |
          echo "=== APK generados ==="
          find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Final build status
        if: always()
        shell: bash
        run: |
          echo "Debug outcome: ${{ steps.debug.outcome }}"
          echo "Release outcome: ${{ steps.release.outcome }}"

          if [ "${{ steps.debug.outcome }}" != "success" ] || \
             [ "${{ steps.release.outcome }}" != "success" ]; then
            exit 1
          fi
          
