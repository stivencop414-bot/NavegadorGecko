                              append(
                                  "\n\nPermisos: "
                              )

                              append(
                                  permissions
                                      .joinToString(
                                          ", "
                                      )
                              )
                          }

                          if (
                              origins
                                  .isNotEmpty()
                          ) {
                              append(
                                  "\n\nSitios: "
                              )

                              append(
                                  origins
                                      .joinToString(
                                          ", "
                                      )
