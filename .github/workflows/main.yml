name: Nexo v0.13.3 - PiP Audio Extensions Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: nexo-v0133-pip-audio-extensions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.14.4"

    steps:
      - name: Checkout Nexo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Nexo v0.13.3 fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")
          MAIN = ROOT / "app/src/main/java/com/ejemplo/navegador/MainActivity.kt"
          MEDIA = ROOT / "app/src/main/java/com/ejemplo/navegador/BrowserMediaController.kt"
          TABS = ROOT / "app/src/main/java/com/ejemplo/navegador/TabManager.kt"
          EXT = ROOT / "app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt"
          EXT_UI = ROOT / "app/src/main/java/com/ejemplo/navegador/ExtensionsActivity.kt"
          SCRIPT = ROOT / "app/src/main/assets/extensions/nexo_bridge/content_script.js"
          GRADLE = ROOT / "app/build.gradle.kts"

          main = MAIN.read_text(encoding="utf-8")
          tabs = TABS.read_text(encoding="utf-8")
          ext = EXT.read_text(encoding="utf-8")
          ext_ui = EXT_UI.read_text(encoding="utf-8")
          js = SCRIPT.read_text(encoding="utf-8")
          gradle = GRADLE.read_text(encoding="utf-8")

          def must_replace(text, old, new, label, count=1):
              # 1) Intento exacto: rápido y seguro.
              if old in text:
                  return text.replace(old, new, count)

              # 2) Fallback tolerante a formato/sangría.
              # Convierte cualquier grupo de espacios/saltos de línea
              # del bloque esperado en \s+, manteniendo intactos los
              # tokens reales del código. Evita falsos fallos por
              # reformatos de Kotlin/JS sin hacer reemplazos ciegos.
              tokens = re.split(r"\s+", old.strip())
              pattern = r"\s+".join(
                  re.escape(token)
                  for token in tokens
                  if token
              )

              updated, replaced = re.subn(
                  pattern,
                  lambda _: new.strip("\n") + "\n",
                  text,
                  count=count,
                  flags=re.MULTILINE,
              )

              if replaced != count:
                  raise RuntimeError(
                      f"No se encontró bloque para: {label} "
                      f"(exacto ni flexible; encontrados={replaced})"
                  )

              return updated

          def replace_between(text, start_marker, end_marker, replacement, label):
              if start_marker not in text:
                  raise RuntimeError(f"No se encontró inicio para: {label}")
              start = text.index(start_marker)
              try:
                  end = text.index(end_marker, start)
              except ValueError:
                  raise RuntimeError(f"No se encontró fin para: {label}")
              return text[:start] + replacement + text[end:]

          # =========================================================
          # 1. BrowserMediaController.kt
          #    - estado nativo + JS
          #    - memoria corta de reproducción
          #    - recuperación controlada tras transición a PiP/fondo
          # =========================================================

          media = r'''package com.ejemplo.navegador

          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import org.mozilla.geckoview.MediaSession

          object BrowserMediaController {
              interface Listener {
                  fun onBrowserMediaStateChanged()
              }

              data class Snapshot(
                  val tabId: String,
                  val title: String,
                  val playing: Boolean
              )

              private data class Entry(
                  val mediaSession: MediaSession,
                  var title: String,
                  var playing: Boolean = false
              )

              private data class VideoState(
                  var present: Boolean = false,
                  var playing: Boolean = false,
                  var width: Int = 0,
                  var height: Int = 0
              )

              private val entries =
                  linkedMapOf<String, Entry>()

              private val videos =
                  mutableMapOf<String, VideoState>()

              /*
               * Se mantiene separado del estado "playing".
               *
               * YouTube puede emitir una pausa transitoria exactamente
               * durante Home/PiP. No queremos interpretar esa transición
               * como una orden explícita del usuario.
               */
              private val recentPlayback =
                  mutableMapOf<String, Long>()

              private val main =
                  Handler(Looper.getMainLooper())

              private var listener: Listener? = null
              private var currentTabId: String? = null

              private fun now(): Long =
                  SystemClock.elapsedRealtime()

              private fun markRecentlyPlaying(
                  tabId: String
              ) {
                  recentPlayback[tabId] = now()
              }

              fun attach(value: Listener?) {
                  listener = value
                  listener?.onBrowserMediaStateChanged()
              }

              fun onActivated(
                  tab: BrowserTab,
                  media: MediaSession
              ) {
                  val previous = entries[tab.id]

                  entries[tab.id] =
                      Entry(
                          mediaSession = media,
                          title =
                              tab.title.ifBlank {
                                  previous?.title
                                      ?: "Multimedia en Nexo"
                              },
                          playing =
                              previous?.playing == true
                      )

                  currentTabId = tab.id
                  notifyChanged()
              }

              fun onDeactivated(
                  tabId: String,
                  media: MediaSession
              ) {
                  if (
                      entries[tabId]
                          ?.mediaSession === media
                  ) {
                      entries.remove(tabId)

                      if (currentTabId == tabId) {
                          currentTabId = null
                      }
                  }

                  /*
                   * No borrar recentPlayback aquí:
                   * Gecko puede desactivar/recrear MediaSession durante
                   * la transición de actividad sin que el usuario haya
                   * detenido el contenido.
                   */
                  notifyChanged()
              }

              fun onPlay(
                  tab: BrowserTab,
                  media: MediaSession
              ) {
                  val entry = entries[tab.id]

                  if (
                      entry == null ||
                      entry.mediaSession !== media
                  ) {
                      entries[tab.id] =
                          Entry(
                              mediaSession = media,
                              title =
                                  tab.title.ifBlank {
                                      "Multimedia en Nexo"
                                  },
                              playing = true
                          )
                  } else {
                      if (tab.title.isNotBlank()) {
                          entry.title = tab.title
                      }

                      entry.playing = true
                  }

                  currentTabId = tab.id
                  markRecentlyPlaying(tab.id)
                  notifyChanged()
              }

              fun onPause(
                  tabId: String,
                  media: MediaSession
              ) {
                  entries[tabId]
                      ?.takeIf {
                          it.mediaSession === media
                      }
                      ?.playing = false

                  notifyChanged()
              }

              fun onStop(
                  tabId: String,
                  media: MediaSession
              ) {
                  if (
                      entries[tabId]
                          ?.mediaSession === media
                  ) {
                      entries.remove(tabId)
                  }

                  if (currentTabId == tabId) {
                      currentTabId = null
                  }

                  notifyChanged()
              }

              fun updateMetadata(
                  tabId: String,
                  media: MediaSession,
                  title: String?
              ) {
                  val entry =
                      entries[tabId]
                          ?: return

                  if (entry.mediaSession !== media) {
                      return
                  }

                  if (!title.isNullOrBlank()) {
                      entry.title = title
                  }

                  notifyChanged()
              }

              fun updateTabTitle(
                  tabId: String,
                  title: String
              ) {
                  val entry =
                      entries[tabId]
                          ?: return

                  if (title.isNotBlank()) {
                      entry.title = title
                  }

                  if (entry.playing) {
                      notifyChanged()
                  }
              }

              fun onVideoState(
                  tabId: String,
                  present: Boolean,
                  playing: Boolean,
                  width: Int,
                  height: Int
              ) {
                  videos[tabId] =
                      VideoState(
                          present = present,
                          playing = playing,
                          width = width.coerceAtLeast(0),
                          height = height.coerceAtLeast(0)
                      )

                  if (playing) {
                      markRecentlyPlaying(tabId)
                  }

                  listener?.onBrowserMediaStateChanged()
              }

              fun resetVideo(tabId: String) {
                  videos.remove(tabId)
                  listener?.onBrowserMediaStateChanged()
              }

              fun removeTab(tabId: String) {
                  entries.remove(tabId)
                  videos.remove(tabId)
                  recentPlayback.remove(tabId)

                  if (currentTabId == tabId) {
                      currentTabId = null
                  }

                  notifyChanged()
              }

              fun isPlaying(tabId: String): Boolean =
                  entries[tabId]?.playing == true

              fun isAnyPlaying(): Boolean =
                  entries.values.any {
                      it.playing
                  }

              fun isVideoPresent(tabId: String): Boolean =
                  videos[tabId]?.present == true

              fun isVideoPlaying(tabId: String): Boolean =
                  videos[tabId]?.playing == true

              fun isPlaybackActive(
                  tabId: String
              ): Boolean =
                  isPlaying(tabId) ||
                      isVideoPlaying(tabId)

              fun wasRecentlyPlaying(
                  tabId: String,
                  windowMs: Long = 6_000L
              ): Boolean {
                  val last =
                      recentPlayback[tabId]
                          ?: return false

                  return now() - last <=
                      windowMs.coerceAtLeast(0L)
              }

              fun shouldKeepAlive(
                  tabId: String,
                  windowMs: Long = 6_000L
              ): Boolean =
                  isPlaybackActive(tabId) ||
                      wasRecentlyPlaying(
                          tabId,
                          windowMs
                      )

              fun videoAspect(
                  tabId: String
              ): Pair<Int, Int> {
                  val state = videos[tabId]

                  return if (
                      (state?.width ?: 0) > 0 &&
                      (state?.height ?: 0) > 0
                  ) {
                      state!!.width to state.height
                  } else {
                      16 to 9
                  }
              }

              /*
               * Recuperación nativa.
               *
               * Solo se invoca cuando MainActivity sabe que el contenido
               * estaba reproduciéndose ANTES de la transición.
               * Por eso no fuerza a reproducir un video que el usuario
               * hubiera dejado pausado.
               */
              fun resumeIfRecent(
                  tabId: String,
                  windowMs: Long = 6_000L
              ): Boolean {
                  if (
                      !wasRecentlyPlaying(
                          tabId,
                          windowMs
                      )
                  ) {
                      return false
                  }

                  val media =
                      entries[tabId]
                          ?.mediaSession
                          ?: return false

                  main.post {
                      runCatching {
                          if (media.isActive) {
                              media.play()
                          }
                      }
                  }

                  return true
              }

              fun snapshot(): Snapshot? {
                  val preferred =
                      currentTabId
                          ?.let { id ->
                              entries[id]
                                  ?.takeIf {
                                      it.playing
                                  }
                                  ?.let {
                                      id to it
                                  }
                          }

                  val selected =
                      preferred
                          ?: entries.entries
                              .lastOrNull {
                                  it.value.playing
                              }
                              ?.let {
                                  it.key to it.value
                              }
                          ?: return null

                  currentTabId = selected.first

                  return Snapshot(
                      tabId = selected.first,
                      title =
                          selected.second
                              .title
                              .ifBlank {
                                  "Multimedia en Nexo"
                              },
                      playing = true
                  )
              }

              fun pauseCurrent() {
                  val media =
                      currentPlayingSession()
                          ?: return

                  main.post {
                      runCatching {
                          media.pause()
                      }
                  }
              }

              fun stopCurrent() {
                  val media =
                      currentPlayingSession()
                          ?: return

                  main.post {
                      runCatching {
                          media.stop()
                      }
                  }
              }

              private fun currentPlayingSession():
                  MediaSession? =
                  snapshot()
                      ?.tabId
                      ?.let {
                          entries[it]
                              ?.mediaSession
                      }

              private fun notifyChanged() {
                  listener
                      ?.onBrowserMediaStateChanged()

                  val context =
                      runCatching {
                          AppContext.get()
                      }.getOrNull()
                          ?: return

                  MediaPlaybackService.sync(
                      context
                  )
              }
          }
          '''

          MEDIA.write_text(
              media,
              encoding="utf-8"
          )

          # =========================================================
          # 2. MainActivity.kt
          # =========================================================

          main = must_replace(
              main,
              '''    private var mediaNotificationPermissionAsked = false
              private var suppressAutoPipOnce = false
          ''',
              '''    private var mediaNotificationPermissionAsked = false
              private var suppressAutoPipOnce = false

              // Estado capturado ANTES de que Android/YouTube cambien
              // la Activity de foreground a PiP/background.
              private var pipPlaybackWasActive = false
              private var backgroundPlaybackWasActive = false
          ''',
              "campos de recuperación multimedia"
          )

          main = must_replace(
              main,
              '''    override fun onResume() {
                  suppressAutoPipOnce = false
                  super.onResume()
          ''',
              '''    override fun onResume() {
                  suppressAutoPipOnce = false
                  backgroundPlaybackWasActive = false
                  super.onResume()
          ''',
              "onResume"
          )

          old_on_stop = '''    override fun onStop() {
                  captureCurrentTabPreview()
                  if (!isInPictureInPictureMode) {
                      TabManager.prepareForBackground()
                  }
                  super.onStop()
              }
          '''

          new_on_stop = '''    override fun onStop() {
                  captureCurrentTabPreview()

                  if (!isInPictureInPictureMode) {
                      val tab =
                          TabManager.activeTab()

                      TabManager.prepareForBackground()

                      /*
                       * Si el usuario salió mientras multimedia estaba
                       * reproduciéndose, damos a Gecko una segunda
                       * oportunidad de continuar después de la transición.
                       */
                      if (
                          backgroundPlaybackWasActive &&
                          BrowserPrefs.backgroundMedia(this) &&
                          tab != null
                      ) {
                          geckoView.postDelayed(
                              {
                                  BrowserMediaController
                                      .resumeIfRecent(
                                          tab.id,
                                          8_000L
                                      )
                              },
                              180L
                          )

                          geckoView.postDelayed(
                              {
                                  BrowserMediaController
                                      .resumeIfRecent(
                                          tab.id,
                                          8_000L
                                      )
                              },
                              650L
                          )
                      }
                  }

                  super.onStop()
              }
          '''

          main = must_replace(
              main,
              old_on_stop,
              new_on_stop,
              "onStop con recuperación de segundo plano"
          )

          old_session = '''    val session =
                  tab.session
                      ?: return

              if (!hasMiniVideo(tab)) {
          '''

          new_session = '''    val session =
                  tab.session
                      ?: return

              /*
               * Capturar el estado antes de tocar CSS, GeckoSession
               * o Picture-in-Picture.
               */
              pipPlaybackWasActive =
                  isMiniPlaybackActive(tab)

              if (!hasMiniVideo(tab)) {
          '''

          main = must_replace(
              main,
              old_session,
              new_session,
              "captura de reproducción al abrir Mini"
          )

          old_entered = '''            if (!entered) {
                          ExtensionManager.setPipMode(
                              session,
                              false
                          )

                          updateMiniPlayerChip()
                      }
          '''

          new_entered = '''            if (!entered) {
                          pipPlaybackWasActive = false

                          ExtensionManager.setPipMode(
                              session,
                              false
                          )

                          updateMiniPlayerChip()
                      } else if (
                          pipPlaybackWasActive
                      ) {
                          /*
                           * Algunos sitios (especialmente YouTube) envían
                           * una pausa transitoria al cambiar de ventana.
                           * Reanudamos únicamente porque sabemos que
                           * estaba reproduciéndose antes de entrar a PiP.
                           */
                          geckoView.postDelayed(
                              {
                                  BrowserMediaController
                                      .resumeIfRecent(
                                          tab.id,
                                          8_000L
                                      )
                              },
                              180L
                          )

                          geckoView.postDelayed(
                              {
                                  BrowserMediaController
                                      .resumeIfRecent(
                                          tab.id,
                                          8_000L
                                      )
                              },
                              650L
                          )
                      }
          '''

          main = must_replace(
              main,
              old_entered,
              new_entered,
              "recuperación tras enterPictureInPictureMode"
          )

          old_leave = '''override fun onUserLeaveHint() {
              val tab =
                  TabManager.activeTab()

              if (
          '''

          new_leave = '''override fun onUserLeaveHint() {
              val tab =
                  TabManager.activeTab()

              /*
               * También cubre modo solo audio / segundo plano.
               * Se captura antes de que el sitio reciba eventos de
               * lifecycle y pueda marcarse temporalmente como pausado.
               */
              backgroundPlaybackWasActive =
                  tab != null &&
                  BrowserPrefs.backgroundMedia(this) &&
                  BrowserMediaController
                      .isPlaybackActive(tab.id)

              if (
          '''

          main = must_replace(
              main,
              old_leave,
              new_leave,
              "captura onUserLeaveHint"
          )

          old_pip_change = '''        if (isInPictureInPictureMode) {
                      TabManager.prepareForPictureInPicture()
                  } else {
                      TabManager.resumeActive()
                  }
          '''

          new_pip_change = '''        if (isInPictureInPictureMode) {
                      TabManager.prepareForPictureInPicture()

                      val tab =
                          TabManager.activeTab()

                      if (
                          pipPlaybackWasActive &&
                          tab != null
                      ) {
                          geckoView.postDelayed(
                              {
                                  BrowserMediaController
                                      .resumeIfRecent(
                                          tab.id,
                                          8_000L
                                      )
                              },
                              140L
                          )
                      }
                  } else {
                      pipPlaybackWasActive = false
                      TabManager.resumeActive()
                  }
          '''

          main = must_replace(
              main,
              old_pip_change,
              new_pip_change,
              "onPictureInPictureModeChanged"
          )

          MAIN.write_text(
              main,
              encoding="utf-8"
          )

          # =========================================================
          # 3. TabManager.kt
          # =========================================================

          old_old_tab = '''            old?.session?.let { session ->
                          val keepMediaAlive =
                              BrowserPrefs.backgroundMedia(requireContext()) &&
                              old != null &&
                              BrowserMediaController.isPlaying(old.id)

                          session.setFocused(false)
                          session.setPriorityHint(
                              if (keepMediaAlive) {
                                  GeckoSession.PRIORITY_HIGH
                              } else {
                                  GeckoSession.PRIORITY_DEFAULT
                              }
                          )
                          session.setActive(keepMediaAlive)
                      }
          '''

          new_old_tab = '''            old?.session?.let { session ->
                          val backgroundEnabled =
                          BrowserPrefs.backgroundMedia(
                              requireContext()
                          )

                      val keepMediaAlive =
                          backgroundEnabled &&
                          BrowserMediaController
                              .shouldKeepAlive(
                                  old.id,
                                  8_000L
                              )

                      session.settings
                          .setSuspendMediaWhenInactive(
                              !backgroundEnabled
                          )

                      session.setFocused(false)
                      ExtensionManager.setTabActive(
                          session,
                          false
                      )

                      session.setPriorityHint(
                          if (keepMediaAlive) {
                              GeckoSession.PRIORITY_HIGH
                          } else {
                              GeckoSession.PRIORITY_DEFAULT
                          }
                      )

                      session.setActive(
                          keepMediaAlive
                      )
                  }
          '''

          tabs = must_replace(
              tabs,
              old_old_tab,
              new_old_tab,
              "switchTo pestaña anterior"
          )

          old_target_active = '''        session.setPriorityHint(GeckoSession.PRIORITY_HIGH)
                  session.setActive(true)
                  session.setFocused(true)

                  listener?.onActiveTabChanged(target, session)
          '''

          new_target_active = '''        session.setPriorityHint(GeckoSession.PRIORITY_HIGH)
                  session.setActive(true)
                  session.setFocused(true)

                  ExtensionManager.setTabActive(
                      session,
                      true
                  )

                  listener?.onActiveTabChanged(target, session)
          '''

          tabs = must_replace(
              tabs,
              old_target_active,
              new_target_active,
              "setTabActive pestaña destino"
          )

          old_ext_inactive = '''        if (activate) {
                      switchTo(tab.id, loadUrl = false)
                  } else {
                      session.setActive(false)
                  }
          '''

          new_ext_inactive = '''        if (activate) {
                      switchTo(tab.id, loadUrl = false)
                  } else {
                      session.setActive(false)

                      ExtensionManager.setTabActive(
                          session,
                          false
                      )
                  }
          '''

          tabs = must_replace(
              tabs,
              old_ext_inactive,
              new_ext_inactive,
              "pestaña de extensión inactiva"
          )

          old_close = '''        removed.session?.let { session ->
                      runCatching {
                          session.setActive(false)
                          session.close()
                      }
                  }
          '''

          new_close = '''        removed.session?.let { session ->
                      runCatching {
                          ExtensionManager.setTabActive(
                              session,
                              false
                          )
                          session.setActive(false)
                          session.close()
                      }
                  }
          '''

          tabs = must_replace(
              tabs,
              old_close,
              new_close,
              "cerrar pestaña y WebExtensions"
          )

          tabs = replace_between(
              tabs,
              "    fun prepareForPictureInPicture() {",
              "    fun prepareForBackground() {",
              r'''    fun prepareForPictureInPicture() {
                  val tab =
                      activeTab()
                          ?: return

                  tab.session?.let {
                      session ->

                      /*
                       * PiP sigue siendo contenido visible.
                       * Nunca suspender multimedia durante esta transición.
                       */
                      session.settings
                          .setSuspendMediaWhenInactive(
                              false
                          )

                      session.setPriorityHint(
                          GeckoSession.PRIORITY_HIGH
                      )

                      session.setActive(true)

                      ExtensionManager.setTabActive(
                          session,
                          true
                      )
                  }

                  BrowserMediaController
                      .resumeIfRecent(
                          tab.id,
                          8_000L
                      )

                  MediaPlaybackService.sync(
                      requireContext()
                  )
              }

          ''',
              "prepareForPictureInPicture"
          )

          tabs = replace_between(
              tabs,
              "    fun prepareForBackground() {",
              "    fun suspendForBackground() {",
              r'''    fun prepareForBackground() {
                  val tab =
                      activeTab()
                          ?: return

                  val context =
                      requireContext()

                  val backgroundEnabled =
                      BrowserPrefs.backgroundMedia(
                          context
                      )

                  val keepMediaAlive =
                      backgroundEnabled &&
                      BrowserMediaController
                          .shouldKeepAlive(
                              tab.id,
                              8_000L
                          )

                  tab.session?.let {
                      session ->

                      session.flushSessionState()
                      session.setFocused(false)

                      /*
                       * Si el usuario habilitó reproducción en segundo
                       * plano no permitimos que Gecko suspenda media.
                       */
                      session.settings
                          .setSuspendMediaWhenInactive(
                              !backgroundEnabled
                          )

                      ExtensionManager.setTabActive(
                          session,
                          false
                      )

                      session.setPriorityHint(
                          if (keepMediaAlive) {
                              GeckoSession.PRIORITY_HIGH
                          } else {
                              GeckoSession.PRIORITY_DEFAULT
                          }
                      )

                      session.setActive(
                          keepMediaAlive
                      )
                  }

                  if (keepMediaAlive) {
                      MediaPlaybackService.sync(
                          context
                      )
                  }

                  persist()
              }

          ''',
              "prepareForBackground"
          )

          old_resume = '''    fun resumeActive() {
                  activeSession()?.let { session ->
                      session.setPriorityHint(GeckoSession.PRIORITY_HIGH)
                      session.setActive(true)
                      session.setFocused(true)
                  }
              }
          '''

          new_resume = '''    fun resumeActive() {
                  activeSession()?.let {
                      session ->

                      session.setPriorityHint(
                          GeckoSession.PRIORITY_HIGH
                      )

                      session.setActive(true)
                      session.setFocused(true)

                      ExtensionManager.setTabActive(
                          session,
                          true
                      )
                  }
              }
          '''

          tabs = must_replace(
              tabs,
              old_resume,
              new_resume,
              "resumeActive"
          )

          TABS.write_text(
              tabs,
              encoding="utf-8"
          )

          # =========================================================
          # 4. content_script.js
          # =========================================================

          js = must_replace(
              js,
              '''  let pipActive = false;
              let reportTimer = 0;
          ''',
              '''  let pipActive = false;
              let pipKeepPlaying = false;
              let pipRecoveryUntil = 0;
              let reportTimer = 0;
          ''',
              "variables PiP JS"
          )

          old_visibility = '''    visibilityHandler = event => {
                if (backgroundMedia) {
                  event.stopImmediatePropagation();
                }
              };
          '''

          new_visibility = '''    visibilityHandler = event => {
              if (backgroundMedia) {
                    /*
                     * Guardar el elemento que estaba reproduciendo ANTES
                     * de que la página procese el cambio de visibilidad.
                     */
                    const playingBefore =
                      playingMediaElement();

                    event.stopImmediatePropagation();

                    if (playingBefore) {
                      setTimeout(() => {
                        try {
                          if (
                            backgroundMedia &&
                            playingBefore.isConnected &&
                            playingBefore.paused &&
                            !playingBefore.ended
                          ) {
                            Promise.resolve(
                              playingBefore.play()
                            ).catch(() => {});
                          }
                        } catch (_) {}
                      }, 140);
                    }
                  }
                };
