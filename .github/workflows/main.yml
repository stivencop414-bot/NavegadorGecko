      - name: Validate Nexo v0.13.4 source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          main = Path(
              "app/src/main/java/com/ejemplo/navegador/MainActivity.kt"
          ).read_text(encoding="utf-8")

          media = Path(
              "app/src/main/java/com/ejemplo/navegador/BrowserMediaController.kt"
          ).read_text(encoding="utf-8")

          service = Path(
              "app/src/main/java/com/ejemplo/navegador/MediaPlaybackService.kt"
          ).read_text(encoding="utf-8")

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          ).read_text(encoding="utf-8")

          gradle = Path(
              "app/build.gradle.kts"
          ).read_text(encoding="utf-8")

          compact_main = "".join(main.split())
          compact_media = "".join(media.split())
          compact_service = "".join(service.split())

          assert "holdPlayback(tab.id,10_000L)" in compact_main
          assert "clearPlaybackHold(tab.id)" in compact_main
          assert "MediaPlaybackService.sync(this)" in compact_main

          assert "playbackHoldUntil" in media
          assert "snapshotForService()" in compact_media
          assert "isPlaybackHoldActive" in media
          assert "resumeIfRecent" in media
          assert "if(!hasActiveHold(tabId))" in compact_media

          # La promoción ocurre en onCreate, ANTES de onStartCommand.
          create_pos = service.index("override fun onCreate()")
          promote_pos = service.index("promoteToForeground(", create_pos)
          start_cmd_pos = service.index("override fun onStartCommand(")
          assert create_pos < promote_pos < start_cmd_pos

          assert "buildBootstrapNotification()" in compact_service
          assert "snapshotForService()" in compact_service
          assert "startRequested" in service
          assert "FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK" in service

          assert 'android:foregroundServiceType="mediaPlayback"' in manifest
          assert 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' in manifest
          assert 'versionCode = 21' in gradle
          assert 'versionName = "0.13.4"' in gradle
          assert "geckoview-omni:153.0.20260715202819" in gradle

          print("✅ Validaciones v0.13.4 correctas")
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build Debug Release and Lint
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee full-build.log

      - name: Validate generated APKs
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk -type f -name "*.apk" -print

          ARM64="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/release -type f -name '*armeabi-v7a*.apk' | head -n 1)"

          test -n "$ARM64" || { echo "❌ No se generó APK arm64-v8a"; exit 1; }
          test -n "$ARM32" || { echo "❌ No se generó APK armeabi-v7a"; exit 1; }

          echo "✅ Ambos APK fueron generados"

      - name: Save verified Nexo v0.13.4 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/build.gradle.kts \
            app/src/main/java/com/ejemplo/navegador/MainActivity.kt \
            app/src/main/java/com/ejemplo/navegador/BrowserMediaController.kt \
            app/src/main/java/com/ejemplo/navegador/MediaPlaybackService.kt

          if git diff --cached --quiet; then
            echo "ℹ️ No hay cambios nuevos para guardar."
          else
            git commit -m "Nexo v0.13.4 foreground audio stability fix [skip ci]"
            git push origin HEAD:main
            echo "✅ Código v0.13.4 guardado en main"
          fi

      - name: Sign Release APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/release

          keytool \
            -genkeypair \
            -keystore nexo-v0134-ci.jks \
            -storepass android \
            -alias nexo \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nexo Browser v0.13.4,O=Nexo,C=CO"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          ARM64="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/release -type f -name '*armeabi-v7a*.apk' | head -n 1)"

          "$APKSIGNER" sign \
            --ks nexo-v0134-ci.jks \
            --ks-key-alias nexo \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out artifacts/release/Nexo-v0.13.4-arm64-v8a.apk \
            "$ARM64"

          "$APKSIGNER" sign \
            --ks nexo-v0134-ci.jks \
            --ks-key-alias nexo \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out artifacts/release/Nexo-v0.13.4-armeabi-v7a.apk \
            "$ARM32"

          "$APKSIGNER" verify --verbose artifacts/release/Nexo-v0.13.4-arm64-v8a.apk
          "$APKSIGNER" verify --verbose artifacts/release/Nexo-v0.13.4-armeabi-v7a.apk

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          sha256sum \
            Nexo-v0.13.4-arm64-v8a.apk \
            Nexo-v0.13.4-armeabi-v7a.apk \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Nexo v0.13.4 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v0134-Foreground-Audio-Stability-Release
          path: |
            artifacts/release/Nexo-v0.13.4-arm64-v8a.apk
            artifacts/release/Nexo-v0.13.4-armeabi-v7a.apk
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.13.4
          name: Nexo Browser v0.13.4
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Nexo Browser v0.13.4

            Descargas:
            - Nexo-v0.13.4-arm64-v8a.apk (Android 64 bits, recomendado)
            - Nexo-v0.13.4-armeabi-v7a.apk (Android 32 bits)
            - SHA256SUMS.txt
          files: |
            artifacts/release/Nexo-v0.13.4-arm64-v8a.apk
            artifacts/release/Nexo-v0.13.4-armeabi-v7a.apk
            artifacts/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v0134-build-diagnostics
          path: |
            full-build.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
