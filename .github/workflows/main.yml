name: Nexo v0.13 - Extensions + GeckoView 153 Stable FIX3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.14.4"

    steps:
      - name: Checkout v0.12.1
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Nexo v0.13 extensions patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s'  | base64 -d | gzip -d > /tmp/nexo_v013.py
          python3 /tmp/nexo_v013.py
          git diff --stat

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager             "platforms;android-${COMPILE_SDK}"             "build-tools;${BUILD_TOOLS}"             "platform-tools"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL             "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"             -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Validate extension UI and source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)

          for p in Path(
              "app/src/main/assets/extensions"
          ).rglob("manifest.json"):
              json.loads(
                  p.read_text(encoding="utf-8")
              )

          activity = Path(
              "app/src/main/java/com/ejemplo/navegador/ExtensionsActivity.kt"
          ).read_text(encoding="utf-8")

          manager = Path(
              "app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt"
          ).read_text(encoding="utf-8")

          store = Path(
              "app/src/main/java/com/ejemplo/navegador/AmoClient.kt"
          ).read_text(encoding="utf-8")

          assert "ACTION_OPEN_DOCUMENT_TREE" in activity
          assert "scanExtensionFolder" in manager
          assert "normalizeArchive" in manager
          assert "updateExtension" in manager
          assert "Accept-Language" in store
          assert "es-CO" in store
          assert "ACTION_OPEN_DOCUMENT_TREE" in activity
          assert "extensionsSearch" in activity
          assert "updateAll()" in activity
          assert "folderButton" in activity
          assert "updateAllButton" in activity

          gradle = Path(
              "app/build.gradle.kts"
          ).read_text(encoding="utf-8")

          assert (
              "org.mozilla.geckoview:geckoview-omni:"
              "153.0.20260715202819"
              in gradle
          )
          PY

          node --check             app/src/main/assets/extensions/nexo_bridge/content_script.js

          node --check             app/src/main/assets/extensions/nexo_translator/content.js

      - name: Build Debug Release and Lint BEFORE commit
        shell: bash
        run: |
          set -euo pipefail

          gradle             :app:assembleDebug             :app:assembleRelease             :app:lintDebug             :app:lintRelease             --stacktrace             --no-daemon             2>&1 | tee full-build.log

      - name: Save verified v0.13 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name             "github-actions[bot]"

          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/

          if ! git diff --cached --quiet; then
            git commit               -m "Nexo v0.13 extensions + GeckoView 153 stable [skip ci]"
            git push origin HEAD:main
          fi

      - name: Sign Release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          keytool -genkeypair             -keystore nexo-v013-ci.jks             -storepass android             -alias nexo             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Nexo Browser v0.13,O=Nexo,C=CO"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          ARM64="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*armeabi-v7a*.apk' | head -n 1)"

          test -n "$ARM64"
          test -n "$ARM32"

          "$APKSIGNER" sign             --ks nexo-v013-ci.jks             --ks-key-alias nexo             --ks-pass pass:android             --key-pass pass:android             --out artifacts/release/Nexo-v0.13.0-arm64-v8a.apk             "$ARM64"

          "$APKSIGNER" sign             --ks nexo-v013-ci.jks             --ks-key-alias nexo             --ks-pass pass:android             --key-pass pass:android             --out artifacts/release/Nexo-v0.13.0-armeabi-v7a.apk             "$ARM32"

          "$APKSIGNER" verify --verbose             artifacts/release/Nexo-v0.13.0-arm64-v8a.apk

          "$APKSIGNER" verify --verbose             artifacts/release/Nexo-v0.13.0-armeabi-v7a.apk

          sha256sum artifacts/release/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v0130-Release-APKs
          path: artifacts/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v0130-diagnostics
          path: |
            full-build.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"

          if ! gh release view v0.13.0 >/dev/null 2>&1; then
            gh release create v0.13.0               --target "$TARGET_SHA"               --title "Nexo Browser v0.13.0"               --notes "GeckoView 153.0 Stable Omni fijado. Administrador de extensiones renovado: tienda de Mozilla orientada a español, categorías, detección de instaladas, búsqueda local, actualización individual/masiva, importación XPI/ZIP, selección de carpeta y búsqueda recursiva de extensiones."
          fi

          gh release upload v0.13.0             artifacts/release/Nexo-v0.13.0-arm64-v8a.apk             artifacts/release/Nexo-v0.13.0-armeabi-v7a.apk             --clobber
