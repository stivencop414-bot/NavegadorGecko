                  val result =
                      GeckoResult<AllowOrDeny>()

                  val activity =
                      promptActivity.get()

                  if (
                      activity == null ||
                      activity.isFinishing
                  ) {
                      result.complete(
                          AllowOrDeny.DENY
                      )
                      return result
                  }

                  val details =
                      buildString {
                          append(
                              extension
                                  .metaData
                                  ?.name
                                  ?: extension.id
                          )

                          append(
                              "\nVersión: "
                          )

