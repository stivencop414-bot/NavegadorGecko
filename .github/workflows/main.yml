                              WebExtension
                                  .SessionTabDelegate {

                              override fun onCloseTab(
                                  source: WebExtension?,
                                  session: GeckoSession
                              ): GeckoResult<AllowOrDeny> {
                                  TabManager
                                      .closeBySession(
                                          session
                                      )

