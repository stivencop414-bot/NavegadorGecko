                  promptActivity = WeakReference(activity)
              }

              fun setTabActive(
                  session: GeckoSession,
                  active: Boolean
              ) {
                  runCatching {
                      GeckoRuntimeHolder
                          .get(AppContext.get())
                          .webExtensionController
                          .setTabActive(
                              session,
                              active
                          )
                  }.onFailure {
                      error ->

                      android.util.Log.w(
                          "NexoExtensions",
                          "No se pudo notificar pestaña activa",
                          error
                      )
                  }
              }

              fun runAction(
                  extension: WebExtension,
                  onDone:
                      (Boolean, String) -> Unit
              ) {
                  val session =
                      TabManager.activeSession()

                  val sessionAction =
                      session
                          ?.let {
                              sessionActions[it]
                                  ?.get(
                                      extension.id
                                  )
                          }

                  val defaultAction =
                      defaultActions[
                          extension.id
                      ]

                  val action =
                      when {
                          sessionAction != null &&
                              defaultAction != null ->
                              runCatching {
                                  sessionAction
                                      .withDefault(
                                          defaultAction
                                      )
                              }.getOrDefault(
                                  sessionAction
                              )

                          sessionAction != null ->
                              sessionAction

                          else ->
                              defaultAction
                      }

                  if (action == null) {
                      onDone(
                          false,
                          "La extensión no expone una acción para esta pestaña."
                      )
                      return
                  }

                  if (action.enabled == false) {
                      onDone(
                          false,
                          "La acción de la extensión está deshabilitada en esta página."
                      )
                      return
                  }

                  runCatching {
                      action.click()
                  }.fold(
                      onSuccess = {
                          onDone(
                              true,
                              action.title
                                  ?.takeIf {
                                      it.isNotBlank()
                                  }
                                  ?: "Acción de extensión ejecutada"
                          )
                      },
                      onFailure = {
                          error ->

                          onDone(
                              false,
                              "No se pudo ejecutar: " +
