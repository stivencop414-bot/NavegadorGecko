name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

# Permite que el propio workflow guarde el proyecto generado en el repositorio.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate project in repository
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/gecko_project.zip
          rm -rf /tmp/gecko_generated
          mkdir -p /tmp/gecko_generated
          unzip -q /tmp/gecko_project.zip -d /tmp/gecko_generated
          cp -a /tmp/gecko_generated/gecko_ci_project/. "$GITHUB_WORKSPACE/"
          echo "Proyecto generado en el repositorio:"
          find app/src/main -type f | sort

      - name: Save generated source files to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore gradle.properties build.gradle.kts settings.gradle.kts app/
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Add GeckoView Android project [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build debug and release
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Show APKs
        if: always()
        shell: bash
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
          
