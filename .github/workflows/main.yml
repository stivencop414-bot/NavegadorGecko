name: Nexo v7 - Android Full Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate project structure
        id: static_validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            echo "===== NEXO V7 STATIC VALIDATION ====="

            test -f settings.gradle.kts
            test -f build.gradle.kts
            test -f gradle.properties
            test -f app/build.gradle.kts
            test -f app/src/main/AndroidManifest.xml
            test -f app/src/main/java/com/ejemplo/navegador/MainActivity.kt
            test -f app/src/main/java/com/ejemplo/navegador/TabManager.kt
            test -f app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt
            test -f app/src/main/assets/extensions/nexo_bridge/manifest.json
            test -f app/src/main/assets/extensions/nexo_bridge/content_script.js
            test -f app/src/main/assets/home/index.html

            python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_files = list(Path("app/src/main").rglob("*.xml"))

          for path in xml_files:
              ET.parse(path)
              print("XML OK:", path)

          for path in Path(
              "app/src/main/assets/extensions"
          ).rglob("manifest.json"):
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              assert data["manifest_version"] == 2
              assert data["browser_specific_settings"]["gecko"]["id"]

              print("WEBEXTENSION OK:", path)

          print("XML total:", len(xml_files))
          PY

            node --check \
              app/src/main/assets/extensions/nexo_bridge/content_script.js

            echo "Validación estática completa."
          } 2>&1 | tee static-validation.log

      - name: Compile Debug Release R8 and Lint
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          gradle \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            --continue \
            --stacktrace \
            --no-daemon \
            2>&1 | tee full-build.log

      - name: Collect every build error
        if: always()
        shell: bash
        run: |
          {
            echo "======================================"
            echo "NEXO V7 - RESUMEN DE ERRORES"
            echo "======================================"
            echo

            echo "===== VALIDACIÓN ESTÁTICA ====="
            cat static-validation.log 2>/dev/null || true

            echo
            echo "===== ERRORES KOTLIN / JAVA / R8 / LINT ====="
            grep -Ei \
              "(^e: | error:|FAILURE:|Execution failed for task|Missing class|Unresolved reference|overrides nothing|Type mismatch|Cannot access|None of the following|Caused by:|Lint found|AAPT: error)" \
              full-build.log 2>/dev/null || true

            echo
            echo "===== WARNINGS ====="
            grep -Ei \
              "(^w: |warning:)" \
              full-build.log 2>/dev/null || true
          } > errors-summary.txt

          cat errors-summary.txt

      - name: Sign Release APKs for testing
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            app/build/outputs/apk/release-ci-signed \
            "$HOME/.android"

          mapfile -t releases < <(
            find app/build/outputs/apk/release \
              -type f \
              -name "*-unsigned.apk" \
              2>/dev/null | sort
          )

          if [ "${#releases[@]}" -eq 0 ]; then
            echo "No hay APK Release unsigned para firmar."
            exit 0
          fi

          KEYSTORE="$HOME/.android/nexo-ci.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias nexo \
              -keypass android \
              -dname "CN=Nexo Browser CI,O=Nexo,C=CO" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          for apk in "${releases[@]}"; do
            name="$(basename "$apk")"

            output="app/build/outputs/apk/release-ci-signed/${name%-unsigned.apk}-signed.apk"

            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias nexo \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              "$apk"

            "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
              verify \
              --verbose \
              "$output"
          done

      - name: Deep APK validation
        if: always()
        shell: bash
        run: |
          set +e
          : > apk-validation.txt

          mapfile -t apks < <(
            find \
              app/build/outputs/apk/debug \
              app/build/outputs/apk/release-ci-signed \
              -type f \
              -name "*.apk" \
              2>/dev/null | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Todavía no hay APKs." \
              | tee -a apk-validation.txt
            exit 0
          fi

          for apk in "${apks[@]}"; do
            echo "========================================" \
              | tee -a apk-validation.txt

            echo "$apk" \
              | tee -a apk-validation.txt

            unzip -tq "$apk" >/dev/null

            for required in \
              assets/home/index.html \
              assets/extensions/nexo_bridge/manifest.json \
              assets/extensions/nexo_bridge/content_script.js
            do
              if unzip -Z1 "$apk" | grep -qx "$required"; then
                echo "OK: $required" \
                  | tee -a apk-validation.txt
              else
                echo "FALTA: $required" \
                  | tee -a apk-validation.txt
              fi
            done

            echo -n "ABIs: " \
              | tee -a apk-validation.txt

            unzip -Z1 "$apk" \
              | awk -F/ '/^lib\// {print $2}' \
              | sort -u \
              | tr '\n' ' ' \
              | tee -a apk-validation.txt

            echo \
              | tee -a apk-validation.txt

            sha256sum "$apk" \
              | tee -a apk-validation.txt

            stat -c "Bytes: %s" "$apk" \
              | tee -a apk-validation.txt

            "$ANDROID_HOME/build-tools/34.0.0/aapt" \
              dump badging "$apk" \
              | head -n 12 \
              | tee -a apk-validation.txt
          done

      - name: APK inventory
        if: always()
        shell: bash
        run: |
          echo "===== APK OUTPUTS ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -printf "%p  %s bytes\n" \
            2>/dev/null \
            | sort || true

      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed Release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7-release
          path: app/build/outputs/apk/release-ci-signed/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v7-diagnostics
          path: |
            static-validation.log
            full-build.log
            errors-summary.txt
            apk-validation.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Final strict status
        if: always()
        shell: bash
        run: |
          echo "Static validation: ${{ steps.static_validation.outcome }}"
          echo "Gradle build: ${{ steps.gradle_build.outcome }}"

          if [ "${{ steps.static_validation.outcome }}" != "success" ]; then
            echo "Falló la validación estática."
            exit 1
          fi

          if [ "${{ steps.gradle_build.outcome }}" != "success" ]; then
            echo "Gradle encontró errores."
            exit 1
          fi

          debug_count="$(
            find app/build/outputs/apk/debug \
              -name '*.apk' \
              2>/dev/null | wc -l
          )"

          release_count="$(
            find app/build/outputs/apk/release-ci-signed \
              -name '*.apk' \
              2>/dev/null | wc -l
          )"

          echo "Debug APKs: $debug_count"
          echo "Release APKs firmados: $release_count"

          if [ "$debug_count" -lt 2 ]; then
            echo "Se esperaban al menos 2 APK Debug."
            exit 2
          fi

          if [ "$release_count" -lt 2 ]; then
            echo "Se esperaban al menos 2 APK Release firmados."
            exit 3
          fi

          echo "NEXO V7 FULL BUILD OK"
