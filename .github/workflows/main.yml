name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/gecko_project.zip
          unzip -q /tmp/gecko_project.zip -d "$GITHUB_WORKSPACE"
          echo "Proyecto creado:"
          find gecko_ci_project -maxdepth 4 -type f | sort

      - name: Build debug and release
        shell: bash
        run: |
          set -o pipefail
          cd gecko_ci_project
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Show APKs
        if: always()
        run: |
          find gecko_ci_project/app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-APKs
          path: gecko_ci_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NavegadorGecko-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
          
