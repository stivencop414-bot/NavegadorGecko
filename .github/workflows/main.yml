          media_helper = '''  function videoList() {
              return collectVideos(document, []).filter(visibleEnough);
            }

            function playingMediaElement() {
                  const video =
                    bestVideo(true);

                  if (video) {
                    return video;
                  }

                  try {
                    const audio =
                      Array.from(
                        document.querySelectorAll("audio")
                      ).find(
                        item =>
