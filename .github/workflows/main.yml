name: Nexo v0.7.1 - Gecko153 Fix & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPILE_SDK: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.14.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Patch GeckoView 153 PromptDelegate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt")
          s = p.read_text(encoding="utf-8")

          if "override fun onInstallPromptRequest(" in s and "newDataCollectionPermissions" in s:
              print("PromptDelegate ya está actualizado para GeckoView 153.")
          else:
              marker = "    /*\n     * GeckoView 125 usa estos callbacks de PromptDelegate."
              if marker not in s:
                  raise SystemExit("No se encontró el bloque antiguo PromptDelegate; no se modifica el archivo.")

              start = s.index(marker)
              end = s.index("    private fun showPermissionPrompt(", start)

              block = r'''    /* GeckoView 153 PromptDelegate */
    private val promptDelegate =
        object : WebExtensionController.PromptDelegate {
            override fun onInstallPromptRequest(
                extension: WebExtension,
                permissions: Array<out String>,
                origins: Array<out String>,
                dataCollectionPermissions: Array<out String>
            ): GeckoResult<WebExtension.PermissionPromptResponse>? =
                showInstallPermissionPrompt(
                    extension,
                    permissions,
                    origins,
                    dataCollectionPermissions
                )

            override fun onUpdatePrompt(
                extension: WebExtension,
                newPermissions: Array<out String>,
                newOrigins: Array<out String>,
                newDataCollectionPermissions: Array<out String>
            ): GeckoResult<AllowOrDeny>? =
                showPermissionPrompt(extension, "Actualizar extensión")
        }

    private fun showInstallPermissionPrompt(
        extension: WebExtension,
        permissions: Array<out String>,
        origins: Array<out String>,
        dataCollectionPermissions: Array<out String>
    ): GeckoResult<WebExtension.PermissionPromptResponse> {
        val result = GeckoResult<WebExtension.PermissionPromptResponse>()
        val activity = promptActivity.get()

        fun response(allowed: Boolean) =
            WebExtension.PermissionPromptResponse(
                allowed,
                false,
                allowed && dataCollectionPermissions.isNotEmpty()
            )

        if (activity == null || activity.isFinishing) {
            result.complete(response(false))
            return result
        }

        val details = buildString {
            append(extension.metaData?.name ?: extension.id)
            append("\nVersión: ")
            append(extension.metaData?.version ?: "?")
            if (permissions.isNotEmpty()) {
                append("\n\nPermisos: ")
                append(permissions.joinToString(", "))
            }
            if (origins.isNotEmpty()) {
                append("\n\nSitios: ")
                append(origins.joinToString(", "))
            }
            if (dataCollectionPermissions.isNotEmpty()) {
                append("\n\nDatos solicitados: ")
                append(dataCollectionPermissions.joinToString(", "))
            }
        }

        activity.runOnUiThread {
            AlertDialog.Builder(activity)
                .setTitle("Instalar extensión")
                .setMessage(details)
                .setNegativeButton("Cancelar") { _, _ ->
                    result.complete(response(false))
                }
                .setPositiveButton("Permitir") { _, _ ->
                    result.complete(response(true))
                }
                .setOnCancelListener {
                    result.complete(response(false))
                }
                .show()
        }

        return result
    }

'''

              p.write_text(s[:start] + block + s[end:], encoding="utf-8")
              print("PromptDelegate actualizado para GeckoView 153.")
          PY

      - name: Persist source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt; then
            echo "No hay cambios nuevos que guardar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt
            git commit -m "Fix GeckoView 153 extension prompts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          keytool -genkeypair \
            -keystore ci-release.jks \
            -storepass android \
            -alias nexo \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nexo CI, OU=Browser, O=Nexo, L=CI, S=CI, C=US"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$APKSIGNER"

          ARM64="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*armeabi-v7a*.apk' | head -n 1)"

          test -n "$ARM64"
          test -n "$ARM32"

          for spec in \
            "$ARM64|artifacts/release/Nexo-v0.7.1-arm64-v8a.apk" \
            "$ARM32|artifacts/release/Nexo-v0.7.1-armeabi-v7a.apk"
          do
            src="${spec%%|*}"
            dst="${spec#*|}"
            "$APKSIGNER" sign \
              --ks ci-release.jks \
              --ks-key-alias nexo \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$dst" \
              "$src"
            "$APKSIGNER" verify --verbose "$dst"
          done

          echo "===== APK FIRMADAS ====="
          ls -lh artifacts/release/*.apk
          echo "===== SHA-256 ====="
          sha256sum artifacts/release/*.apk
          test "$(find artifacts/release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v071-Release-APKs
          path: artifacts/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.1 >/dev/null 2>&1; then
            echo "Actualizando Release v0.7.1"
          else
            gh release create v0.7.1 \
              --target "${GITHUB_SHA}" \
              --title "Nexo Browser v0.7.1" \
              --notes "Nexo Browser v0.7.1 con GeckoView 153. ARM64 recomendada para teléfonos Android modernos."
          fi
          gh release upload v0.7.1 artifacts/release/*.apk --clobber
          gh release view v0.7.1
