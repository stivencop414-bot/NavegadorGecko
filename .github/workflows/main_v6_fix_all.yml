name: Nexo v6 - Fix All & Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply consolidated GeckoView 125 fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java/com/ejemplo/navegador")

          def replace_required(path, old, new):
              p = root / path
              text = p.read_text(encoding="utf-8")

              if old in text:
                  p.write_text(text.replace(old, new), encoding="utf-8")
                  print("FIX:", path, "->", old.splitlines()[0][:70])
                  return

              if new in text:
                  print("YA FIX:", path, "->", new.splitlines()[0][:70])
                  return

              raise SystemExit(
                  f"No encontré patrón seguro en {path}: {old[:100]!r}"
              )

          replace_required(
              "ExtensionManager.kt",
              "{ onError(it) }",
              '''{
                    onError(
                        it ?: IllegalStateException(
                            "GeckoView devolvió un error nulo"
                        )
                    )
                }'''
          )

          replace_required(
              "ExtensionManager.kt",
              '"No se pudo instalar: ${error.message ?: error.javaClass.simpleName}"',
              '"No se pudo instalar: ${error?.message ?: error?.javaClass?.simpleName ?: "error desconocido"}"'
          )

          replace_required(
              "ExtensionManager.kt",
              'onDone(false, error.message ?: "No se pudo cambiar el estado")',
              'onDone(false, error?.message ?: "No se pudo cambiar el estado")'
          )

          replace_required(
              "ExtensionManager.kt",
              '{ onDone(false, it.message ?: "No se pudo desinstalar") }',
              '{ onDone(false, it?.message ?: "No se pudo desinstalar") }'
          )

          replace_required(
              "ExtensionManager.kt",
              '{ onDone(false, it.message ?: "No se pudo cambiar el permiso") }',
              '{ onDone(false, it?.message ?: "No se pudo cambiar el permiso") }'
          )

          replace_required(
              "ExtensionManager.kt",
              '''override fun onCloseTab(
                    source: WebExtension,
                    session: GeckoSession
                )''',
              '''override fun onCloseTab(
                    source: WebExtension?,
                    session: GeckoSession
                )'''
          )

          replace_required(
              "MainActivity.kt",
              '''val text = TextView(this).apply {
                text =''',
              '''val tabText = TextView(this).apply {
                this.text ='''
          )

          replace_required(
              "MainActivity.kt",
              '''row.addView(text)
            row.addView(close)''',
              '''row.addView(tabText)
            row.addView(close)'''
          )

          replace_required(
              "SettingsActivity.kt",
              '"Error: ${error.message}"',
              '"Error: ${error?.message ?: "desconocido"}"'
          )
          PY

          echo "===== DIFF CONSOLIDADO ====="
          git diff -- \
            app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt \
            app/src/main/java/com/ejemplo/navegador/MainActivity.kt \
            app/src/main/java/com/ejemplo/navegador/SettingsActivity.kt

      - name: Commit consolidated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/ejemplo/navegador/ExtensionManager.kt \
            app/src/main/java/com/ejemplo/navegador/MainActivity.kt \
            app/src/main/java/com/ejemplo/navegador/SettingsActivity.kt

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Fix GeckoView 125 v6 compile errors [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Static validation
        id: static_validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
              print("XML OK:", p)

          for p in Path("app/src/main/assets/extensions").rglob("manifest.json"):
              data = json.loads(p.read_text(encoding="utf-8"))
              assert data["manifest_version"] == 2
              assert data["browser_specific_settings"]["gecko"]["id"]
              print("EXTENSION JSON OK:", p)
          PY

            node --check app/src/main/assets/extensions/nexo_bridge/content_script.js
          } 2>&1 | tee static-validation.log

      - name: Compile Debug Release R8 and Lint
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            --continue \
            --stacktrace \
            --no-daemon \
            2>&1 | tee full-build.log

      - name: Collect all errors and warnings
        if: always()
        shell: bash
        run: |
          {
            echo "===== STATIC VALIDATION ====="
            cat static-validation.log 2>/dev/null || true

            echo
            echo "===== COMPILER / R8 / LINT ERRORS ====="
            grep -Ei \
              "(^e: | error:|FAILURE:|Execution failed for task|Missing class|Unresolved reference|overrides nothing|Type mismatch|Cannot access|None of the following|Caused by:|Lint found)" \
              full-build.log 2>/dev/null || true

            echo
            echo "===== WARNINGS ====="
            grep -Ei "(^w: |warning:)" full-build.log 2>/dev/null || true
          } > errors-summary.txt

          cat errors-summary.txt

      - name: Sign Release APKs if available
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p app/build/outputs/apk/release-ci-signed

          if [ ! -d app/build/outputs/apk/release ]; then
            echo "Sin carpeta Release; se omite firma."
            exit 0
          fi

          mapfile -t apks < <(
            find app/build/outputs/apk/release \
              -type f -name "*-unsigned.apk" | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Sin APK Release unsigned; se omite firma."
            exit 0
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Nexo CI,O=Nexo,C=CO" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            out="app/build/outputs/apk/release-ci-signed/${name%-unsigned.apk}-ci-signed.apk"

            apksigner sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$out" \
              "$apk"

            apksigner verify --verbose "$out"
          done

      - name: Deep APK validation
        if: always()
        shell: bash
        run: |
          set +e
          : > apk-validation.txt

          mapfile -t apks < <(
            find \
              app/build/outputs/apk/debug \
              app/build/outputs/apk/release-ci-signed \
              -type f -name "*.apk" 2>/dev/null | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No hay APKs todavía." | tee -a apk-validation.txt
            exit 0
          fi

          for apk in "${apks[@]}"; do
            echo "========================================" | tee -a apk-validation.txt
            echo "$apk" | tee -a apk-validation.txt

            unzip -tq "$apk" >/dev/null ||
              echo "APK ZIP INVALIDO" | tee -a apk-validation.txt

            for required in \
              assets/home/index.html \
              assets/extensions/nexo_bridge/manifest.json \
              assets/extensions/nexo_bridge/content_script.js
            do
              unzip -Z1 "$apk" | grep -qx "$required" &&
                echo "OK: $required" | tee -a apk-validation.txt ||
                echo "FALTA: $required" | tee -a apk-validation.txt
            done

            echo -n "ABIs: " | tee -a apk-validation.txt
            unzip -Z1 "$apk" |
              awk -F/ '/^lib\// {print $2}' |
              sort -u | tr '\n' ' ' | tee -a apk-validation.txt
            echo | tee -a apk-validation.txt

            sha256sum "$apk" | tee -a apk-validation.txt
            stat -c "Bytes: %s" "$apk" | tee -a apk-validation.txt

            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" |
              head -n 12 | tee -a apk-validation.txt
          done

      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v6-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed Release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v6-release-ci-signed-apks
          path: app/build/outputs/apk/release-ci-signed/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v6-diagnostics
          path: |
            static-validation.log
            full-build.log
            errors-summary.txt
            apk-validation.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Final strict status
        if: always()
        shell: bash
        run: |
          echo "Static validation: ${{ steps.static_validation.outcome }}"
          echo "Gradle: ${{ steps.gradle_build.outcome }}"

          if [ "${{ steps.static_validation.outcome }}" != "success" ] ||
             [ "${{ steps.gradle_build.outcome }}" != "success" ]; then
            exit 1
          fi

          debug_count="$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | wc -l)"
          release_count="$(find app/build/outputs/apk/release-ci-signed -name '*.apk' 2>/dev/null | wc -l)"

          if [ "$debug_count" -lt 2 ] || [ "$release_count" -lt 2 ]; then
            echo "Faltan APK: debug=$debug_count release=$release_count"
            exit 2
          fi

          echo "NEXO V6 FULL BUILD OK"
